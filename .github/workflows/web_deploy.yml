name: Vanilla Web Server Continuous Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest

    steps:
      # 1. 가상 머신에 현재 소스코드 다운로드
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. 마켓플레이스의 SSH 배포 액션을 사용하여 서버에 접속 후 파일 전송 및 명령 실행
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # 원격 서버 내부에서 실행할 스크립트 (상황에 맞게 경로 수정)
          script: |
            echo "=== 배포 시작 ==="
            # 프로젝트 디렉토리로 이동 (없으면 생성)
            #mkdir -p ~/vanilla-web
            cd ~/www

            git fetch --all
            git reset --hard origin/main

            # 실습 편의상 기존 코드를 지우고 GitHub 최신 소스를 가져오거나 배포 처리를 합니다.
            # (만약 서버 내에 git 설정이 되어있다면 git pull 실행)
            echo "원격 서버 배포 성공 완료!"
            uptime
